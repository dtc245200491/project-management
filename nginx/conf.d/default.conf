# ==============================================================================
# NGINX REVERSE PROXY & HTTPS GATEWAY CONFIGURATION (ĐỀ 14)
# ==============================================================================

# 1. Chuyển hướng toàn bộ lưu lượng HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Mã 301 Permanent Redirect
    return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS an toàn (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    # Chứng chỉ số SSL/TLS tự ký
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Giao thức & Bộ mã hóa bảo mật cao
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # =========================================================================
    # CÁC HTTP SECURITY HEADERS (HARDENING)
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # ROUTE 1: pgAdmin GUI Database Management (/pgadmin/)
    # -------------------------------------------------------------------------
    location /pgadmin/ {
        proxy_pass http://pgadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }

    # -------------------------------------------------------------------------
    # ROUTE 2: Web App Quản lý Dự án (Gốc /)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://pm-app:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSocket và kết nối liên tục
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
